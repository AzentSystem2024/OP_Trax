<div class="view-wrapper">
  <div
    class="container-fluid toolbar-fields SearchParams-container mt-2"
    [ngClass]="{ 'hide-content': !isContentVisible }"
  >
    <dx-form>
      <dxi-item
        itemType="group"
        cssClass="form-group"
        class="rowGroup"
        [colCount]="16"
        [colCountByScreen]="{ xs: 16, sm: 16, md: 16, lg: 16 }"
      >
        <dxi-item [colSpan]="5">
          <dx-drop-down-box
            label="Facility"
            labelMode="floating"
            labelLocation="left"
            [(value)]="selectedFacility"
            valueExpr="FacilityLicense"
            [displayExpr]="displayFacility"
            [showClearButton]="true"
            [dataSource]="facilityListDataSource"
            [dropDownOptions]="{ width: 'auto' }"
          >
            <div *dxTemplate="let data of 'content'">
              <dx-data-grid
                #facilityGrid
                [dataSource]="facilityListDataSource"
                keyExpr="FacilityLicense"
                [columns]="[
                  {
                    dataField: 'FacilityLicense',
                    caption: 'License',
                    width: 150,
                  },
                  { dataField: 'FacilityName', caption: 'Name', width: 200 },
                  {
                    dataField: 'FacilityRegion',
                    caption: 'Region',
                    width: 'auto',
                  },
                ]"
                [selection]="{ mode: 'multiple' }"
                [hoverStateEnabled]="true"
                [paging]="{ enabled: true, pageSize: 10 }"
                [filterRow]="{ visible: true }"
                [headerFilter]="{ visible: true }"
                [scrolling]="{ mode: 'virtual' }"
                [height]="'auto'"
                [(selectedRowKeys)]="selectedFacility"
              ></dx-data-grid>
            </div>
          </dx-drop-down-box>
        </dxi-item>

        <dxi-item [colSpan]="2">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="Year"
            [(value)]="selectedYear"
            [dataSource]="years"
            (onValueChanged)="onYearChanged($event)"
            placeholder="Year"
          ></dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="2">
          <dx-select-box
            labelMode="floating"
            labelLocation="left"
            label="Month"
            [dataSource]="monthDataSource"
            displayExpr="name"
            valueExpr="value"
            [(value)]="selectedmonth"
            (onValueChanged)="onMonthValueChanged($event)"
          >
          </dx-select-box>
        </dxi-item>

        <dxi-item [colSpan]="2">
          <dx-date-box
            label="From Date"
            labelMode="floating"
            labelLocation="left"
            [(value)]="fromDate"
            [displayFormat]="'dd-MM-yyyy'"
            type="date"
            [min]="minDate"
            [max]="maxDate"
          >
          </dx-date-box>
        </dxi-item>

        <dxi-item [colSpan]="2">
          <dx-date-box
            label="To Date"
            labelMode="floating"
            labelLocation="left"
            [(value)]="toDate"
            [displayFormat]="'dd-MM-yyyy'"
            [min]="fromDate"
            [max]="today"
            type="date"
          >
          </dx-date-box>
        </dxi-item>

        <dxi-item [colSpan]="3" class="mt-1">
          <div class="d-flex justify-content-end align-items-center w-100">
            <dx-button
              text="Apply"
              icon=""
              class="add-card ms-2"
              type="default"
              *ngIf="!isLookupLoading"
              (onClick)="onApplyFilter()"
            >
            </dx-button>

            <dx-button
              *ngIf="isLookupLoading"
              text="Cancel"
              type="danger"
              class="add-card ms-2"
              (onClick)="cancelApiCall()"
            >
            </dx-button>
          </div>
        </dxi-item>
      </dxi-item>
    </dx-form>
  </div>

  <div class="button-container mt-1 mb-2">
    <dx-button
      class="toggleButton"
      icon="{{ isContentVisible ? 'chevronup' : 'chevrondown' }}"
      stylingMode="outlined"
      type="normal"
      [hint]="isContentVisible ? 'Hide Filter Content' : 'Show Filter Content'"
      [width]="200"
      [height]="13"
      (onClick)="toggleContent()"
    >
    </dx-button>
  </div>

  <dx-data-grid
    [height]="isContentVisible ? '76vh' : '82vh'"
    class="grid theme-dependent"
    [noDataText]="!isContentVisible ? 'No Data Available' : ' '"
    [dataSource]="dataSource"
    [showBorders]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [allowColumnResizing]="false"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    [columnAutoWidth]="true"
    rowAlternationInterval="2"
    [columnFixing]="{
      enabled: true,
      texts: { fix: 'Freeze', unfix: 'Unfreeze' },
    }"
    (onExporting)="onExporting($event)"
    (onSelectionChanged)="onSelectionChanged($event)"
    (onCellPrepared)="onCellPrepared($event)"
  >
    <dxo-editing
      mode="popup"
      [allowUpdating]="false"
      [allowDeleting]="false"
      [allowAdding]="true"
      [popup]="{ width: '35%', height: '70vh' }"
    >
    </dxo-editing>

    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"
    >
    </dxo-pager>
    <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
    <dxo-load-panel [enabled]="true" [showPane]="true"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>
    <dxo-header-filter [visible]="isFilterRowVisible"></dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-filter-panel [visible]="isFilterRowVisible"></dxo-filter-panel>
    <dxo-filter-builder [allowHierarchicalFields]="true"> </dxo-filter-builder>
    <dxo-search-panel [visible]="true" placeholder=" Search"></dxo-search-panel>
    <dxo-grouping
      [autoExpandAll]="false"
      [contextMenuEnabled]="true"
      [expandMode]="'rowClick'"
    ></dxo-grouping>
    <dxo-export
      [enabled]="true"
      [allowExportSelectedData]="false"
      [formats]="['xlsx']"
    >
    </dxo-export>
    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header">XML Batch</div>
      </dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' },
        }"
      ></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          onClick: refresh,
          stylingMode: 'text',
          hint: 'Refresh',
        }"
      ></dxi-item>

      <dxi-item
        name="exportButton"
        location="after"
        cssClass="custom-export-button"
      ></dxi-item>

      <dxi-item
        name="uploadButton"
        location="after"
        widget="dxButton"
        [options]="uploadButtonOptions"
      ></dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="newButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxo-editing mode="cell" [allowUpdating]="true"></dxo-editing>

    <dxi-column
      dataField="SL"
      caption="SL"
      [allowEditing]="false"
      alignment="left"
    ></dxi-column>

    <dxi-column
      dataField="FacilityID"
      caption="FacilityID"
      [allowEditing]="false"
      alignment="left"
    ></dxi-column>

    <dxi-column
      dataField="BatchNo"
      caption="Batch No"
      [allowEditing]="false"
    ></dxi-column>

    <dxi-column
      dataField="RecordCount"
      caption="Record Count"
      [allowEditing]="false"
    ></dxi-column>

    <dxi-column
      dataField="CreatedUser"
      caption="Created User"
      [allowEditing]="false"
    ></dxi-column>

    <dxi-column
      dataField="TransactionDate"
      caption="Transaction Date"
      [allowEditing]="false"
      dataType="date"
      format="dd-MM-yyyy"
    ></dxi-column>

    <dxi-column
      dataField="UploadTime"
      caption="Upload Time"
      [allowEditing]="false"
    ></dxi-column>

    <dxi-column type="buttons" caption="" [width]="130">
      <dxi-button hint="View Claims" icon="info" [onClick]="onDetailClick">
      </dxi-button>
      <dxi-button
        hint="View XML"
        icon="bi bi-filetype-xml"
        [onClick]="onMainGridShowXmlClick"
        cssClass="ms-2"
      >
      </dxi-button>
      <dxi-button
        hint="Delete Batch"
        icon="trash"
        [onClick]="onDeleteBatchClick"
        [disabled]="isDeleteDisabled"
        cssClass="ms-2 text-danger"
      >
      </dxi-button>
    </dxi-column>
  </dx-data-grid>

  <dx-load-panel
    #processLoadPanel
    [position]="{ of: '.grid' }"
    [visible]="islookUpMultiProcessing"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    [message]="processProgressMessage"
  ></dx-load-panel>

  <dx-load-panel
    [position]="{ of: '.grid' }"
    [visible]="isLookupLoading"
    [showIndicator]="true"
    [showPane]="true"
    [shading]="true"
    [message]="'Loading...'"
  ></dx-load-panel>

  <!-- New Batch Popup -->
  <dx-popup
    [width]="'95%'"
    [height]="'95%'"
    [showTitle]="true"
    title="New Batch Creation"
    [dragEnabled]="false"
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="isNewBatchPopupVisible"
  >
    <div *dxTemplate="let data of 'content'" class="d-flex flex-column h-100">
      <div
        class="container-fluid toolbar-fields SearchParams-container"
        [ngClass]="{ 'hide-content': !isNewContentVisible }"
      >
        <dx-form>
          <dxi-item
            itemType="group"
            cssClass="form-group"
            class="rowGroup"
            [colCount]="16"
            [colCountByScreen]="{ xs: 16, sm: 16, md: 16, lg: 16 }"
          >
            <dxi-item [colSpan]="5">
              <dx-drop-down-box
                label="Facility"
                labelMode="floating"
                labelLocation="left"
                [(value)]="newSelectedFacility"
                valueExpr="FacilityLicense"
                [displayExpr]="displayFacility"
                [showClearButton]="true"
                [dataSource]="facilityListDataSource"
                [dropDownOptions]="{ width: 'auto' }"
              >
                <div *dxTemplate="let data of 'content'">
                  <dx-data-grid
                    [dataSource]="facilityListDataSource"
                    keyExpr="FacilityLicense"
                    [columns]="[
                      {
                        dataField: 'FacilityLicense',
                        caption: 'License',
                        width: 150,
                      },
                      {
                        dataField: 'FacilityName',
                        caption: 'Name',
                        width: 200,
                      },
                      {
                        dataField: 'FacilityRegion',
                        caption: 'Region',
                        width: 'auto',
                      },
                    ]"
                    [selection]="{ mode: 'multiple' }"
                    [hoverStateEnabled]="true"
                    [paging]="{ enabled: true, pageSize: 10 }"
                    [filterRow]="{ visible: true }"
                    [headerFilter]="{ visible: true }"
                    [scrolling]="{ mode: 'virtual' }"
                    [height]="'auto'"
                    [(selectedRowKeys)]="newSelectedFacility"
                  ></dx-data-grid>
                </div>
              </dx-drop-down-box>
            </dxi-item>

            <dxi-item [colSpan]="2">
              <dx-select-box
                labelMode="floating"
                labelLocation="left"
                label="Year"
                [(value)]="newSelectedYear"
                [dataSource]="years"
                (onValueChanged)="onNewYearChanged($event)"
                placeholder="Year"
              ></dx-select-box>
            </dxi-item>

            <dxi-item [colSpan]="2">
              <dx-select-box
                labelMode="floating"
                labelLocation="left"
                label="Month"
                [dataSource]="monthDataSource"
                displayExpr="name"
                valueExpr="value"
                [(value)]="newSelectedMonth"
                (onValueChanged)="onNewMonthValueChanged($event)"
              >
              </dx-select-box>
            </dxi-item>

            <dxi-item [colSpan]="2">
              <dx-date-box
                label="From Date"
                labelMode="floating"
                labelLocation="left"
                [(value)]="newFromDate"
                [displayFormat]="'dd-MM-yyyy'"
                type="date"
                [min]="minDate"
                [max]="maxDate"
              >
              </dx-date-box>
            </dxi-item>

            <dxi-item [colSpan]="2">
              <dx-date-box
                label="To Date"
                labelMode="floating"
                labelLocation="left"
                [(value)]="newToDate"
                [displayFormat]="'dd-MM-yyyy'"
                [min]="newFromDate"
                [max]="today"
                type="date"
              >
              </dx-date-box>
            </dxi-item>

            <dxi-item [colSpan]="3" class="mt-1">
              <div class="d-flex justify-content-end align-items-center w-100">
                <dx-button
                  text="Apply"
                  icon=""
                  class="add-card ms-2"
                  type="default"
                  *ngIf="!isNewLookupLoading"
                  (onClick)="onNewApplyFilter()"
                >
                </dx-button>
                <dx-button
                  *ngIf="isNewLookupLoading"
                  text="Cancel"
                  type="danger"
                  class="add-card ms-2"
                  (onClick)="cancelNewApiCall()"
                >
                </dx-button>
                <dx-button
                  text="Save"
                  type="default"
                  class="add-card ms-3"
                  stylingMode="contained"
                  icon="save"
                  [disabled]="newBatchDataSource.length === 0"
                  (onClick)="onCreateBatchClick()"
                ></dx-button>
              </div>
            </dxi-item>
          </dxi-item>
        </dx-form>
      </div>

      <dx-data-grid
        #newBatchGrid
        [dataSource]="newBatchDataSource"
        class="grid new-batch-grid theme-dependent mt-2 flex-grow-1"
        [showBorders]="true"
        [showColumnLines]="true"
        [showRowLines]="true"
        [allowColumnResizing]="true"
        [allowColumnReordering]="true"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="true"
        rowAlternationInterval="2"
        [columnFixing]="{
          enabled: true,
          texts: { fix: 'Freeze', unfix: 'Unfreeze' },
        }"
        [height]="'75vh'"
        (onCellPrepared)="onCellPrepared($event)"
      >
        <dxo-selection
          mode="multiple"
          showCheckBoxesMode="always"
        ></dxo-selection>
        <dxo-scrolling mode="virtual"></dxo-scrolling>

        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="allowedPageSizes"
          [displayMode]="displayMode"
          [showPageSizeSelector]="showPageSizeSelector"
          [showInfo]="showInfo"
          [showNavigationButtons]="showNavButtons"
        >
        </dxo-pager>

        <dxi-column
          dataField="ClaimUID"
          caption="Claim UID"
          [allowEditing]="false"
          [visible]="false"
        ></dxi-column>
        <dxi-column
          dataField="FacilityID"
          caption="Facility ID"
          [allowEditing]="false"
        ></dxi-column>
        <dxi-column
          dataField="FacilityRegion"
          caption="Facility Region"
        ></dxi-column>
        <dxi-column dataField="ClaimNumber" caption="Claim Number"></dxi-column>
        <dxi-column
          dataField="TransactionDate"
          caption="Transaction Date"
        ></dxi-column>
        <dxi-column
          dataField="EncounterStartDate"
          caption="Encounter Start Date"
        ></dxi-column>
        <dxi-column
          dataField="EncounterEndDate"
          caption="Encounter End Date"
        ></dxi-column>
        <dxi-column dataField="ReceiverID" caption="Receiver ID"></dxi-column>
        <dxi-column dataField="PatientAge" caption="Patient Age"></dxi-column>
        <dxi-column dataField="PatientID" caption="Patient ID"></dxi-column>
        <dxi-column dataField="PatientName" caption="Patient Name"></dxi-column>
        <dxi-column
          dataField="EncounterType"
          caption="Encounter Type"
        ></dxi-column>
        <dxi-column dataField="Specialty" caption="Specialty"></dxi-column>
        <dxi-column dataField="Diagnosis" caption="Diagnosis"></dxi-column>
        <dxi-column dataField="Status" caption="Status"></dxi-column>
      </dx-data-grid>

      <dx-load-panel
        [position]="{ of: '.new-batch-grid' }"
        [visible]="isNewLookupLoading || isMultiProcessing"
        [showIndicator]="true"
        [showPane]="true"
        [shading]="true"
        [message]="isMultiProcessing ? 'Processing...' : 'Loading...'"
      ></dx-load-panel>
    </div>
  </dx-popup>

  <!-- Batch Claims Data Popup -->
  <dx-popup
    [width]="'95%'"
    [height]="'95%'"
    [showTitle]="true"
    [title]="'Batch Details - ' + selectedBatchNo"
    [dragEnabled]="false"
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="isBatchClaimPopupVisible"
    (onHidden)="onBatchClaimPopupHidden()"
  >
    <div *dxTemplate="let data of 'content'" class="d-flex flex-column h-100">
      <dx-data-grid
        [dataSource]="batchClaimDataSource"
        class="grid theme-dependent mt-2 flex-grow-1"
        [showBorders]="true"
        [showColumnLines]="true"
        [showRowLines]="true"
        [allowColumnResizing]="true"
        [allowColumnReordering]="true"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="true"
        rowAlternationInterval="2"
        [columnFixing]="{
          enabled: true,
          texts: { fix: 'Freeze', unfix: 'Unfreeze' },
        }"
        [height]="'80vh'"
        (onCellPrepared)="onCellPrepared($event)"
      >
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="allowedPageSizes"
          [displayMode]="displayMode"
          [showPageSizeSelector]="showPageSizeSelector"
          [showInfo]="showInfo"
          [showNavigationButtons]="showNavButtons"
        >
        </dxo-pager>

        <dxi-column
          dataField="ClaimUID"
          caption="Claim UID"
          [visible]="false"
        ></dxi-column>
        <dxi-column dataField="FacilityID" caption="Facility ID"></dxi-column>
        <dxi-column
          dataField="FacilityRegion"
          caption="Facility Region"
        ></dxi-column>
        <dxi-column dataField="ClaimNumber" caption="Claim Number"></dxi-column>
        <dxi-column
          dataField="TransactionDate"
          caption="Transaction Date"
        ></dxi-column>
        <dxi-column
          dataField="EncounterStartDate"
          caption="Encounter Start Date"
        ></dxi-column>
        <dxi-column
          dataField="EncounterEndDate"
          caption="Encounter End Date"
        ></dxi-column>
        <dxi-column dataField="ReceiverID" caption="Receiver ID"></dxi-column>
        <dxi-column dataField="PatientAge" caption="Patient Age"></dxi-column>
        <dxi-column dataField="PatientID" caption="Patient ID"></dxi-column>
        <dxi-column dataField="PatientName" caption="Patient Name"></dxi-column>
        <dxi-column
          dataField="EncounterType"
          caption="Encounter Type"
        ></dxi-column>
        <dxi-column dataField="Specialty" caption="Specialty"></dxi-column>
        <dxi-column dataField="Diagnosis" caption="Diagnosis"></dxi-column>
        <dxi-column dataField="Status" caption="Status"></dxi-column>

        <dxo-toolbar>
          <dxi-item location="before">
            <div class="grid-header">Batch Claim Data</div>
          </dxi-item>
          <dxi-item location="after">
            <dx-button
              text="View XML"
              icon="bi bi-filetype-xml"
              type="default"
              stylingMode="outlined"
              (onClick)="onPopupShowXmlClick()"
            ></dx-button>
          </dxi-item>
        </dxo-toolbar>
      </dx-data-grid>

      <dx-load-panel
        [position]="{ of: '.grid' }"
        [visible]="isBatchClaimLoading"
        [showIndicator]="true"
        [showPane]="true"
        [shading]="true"
        [message]="'Loading...'"
      ></dx-load-panel>
    </div>
  </dx-popup>

  <!-- XML Viewer Popup -->
  <dx-popup
    [width]="'80%'"
    [height]="'90vh'"
    [showTitle]="true"
    [title]="'Batch XML - ' + selectedBatchNo"
    [dragEnabled]="true"
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="isXmlPopupVisible"
  >
    <div *dxTemplate="let data of 'content'" class="d-flex flex-column h-100">
      <div class="mb-2 d-flex justify-content-end">
        <dx-button
          icon="download"
          text="Download XML"
          type="default"
          stylingMode="contained"
          (onClick)="downloadXml()"
        ></dx-button>
      </div>
      <dx-text-area
        [value]="xmlContent"
        [readOnly]="true"
        [height]="'100%'"
        class="flex-grow-1"
        stylingMode="outlined"
      ></dx-text-area>
    </div>
  </dx-popup>

  <!-- Upload Progress Popup -->
  <dx-popup
    [width]="'80%'"
    [height]="'80vh'"
    [showTitle]="true"
    title="Upload Progress"
    [dragEnabled]="false"
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="isUploadProgressPopupVisible"
  >
    <div *dxTemplate="let data of 'content'" class="d-flex flex-column h-100">
      <div class="progress-section mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <div class="fw-bold d-flex gap-3">
            <span>Total: {{ uploadTotal }}</span>
            <span class="text-success">Completed: {{ uploadCompleted }}</span>
            <span class="text-danger">Failed: {{ uploadFailed }}</span>
            <span class="text-warning">Pending: {{ uploadPending }}</span>
          </div>
          <dx-button
            text="Cancel Upload"
            type="danger"
            icon="close"
            [disabled]="!isMultiProcessing"
            (onClick)="onCancelUploadClick()"
          ></dx-button>
        </div>
        <dx-progress-bar
          [min]="0"
          [max]="100"
          [value]="uploadProgress"
          [statusFormat]="progressStatus"
        >
        </dx-progress-bar>
      </div>

      <dx-data-grid
        [dataSource]="uploadProgressDataSource"
        class="flex-grow-1 progress-grid"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
      >
        <dxo-scrolling mode="virtual"></dxo-scrolling>
        <dxi-column dataField="BatchNo" caption="Batch No"></dxi-column>
        <dxi-column
          dataField="UploadStatus"
          caption="Status"
          cellTemplate="statusTemplate"
        ></dxi-column>
        <dxi-column dataField="UploadType" caption="Upload Type"></dxi-column>
        <dxi-column dataField="Uploaduser" caption="User"></dxi-column>
        <dxi-column dataField="UploadTime" caption="Time"></dxi-column>
        <dxi-column dataField="ErrorReport" caption="Error Report"></dxi-column>

        <div *dxTemplate="let cell of 'statusTemplate'">
          <span
            [class.text-success]="cell.value === 'Success'"
            [class.text-danger]="cell.value === 'Failed'"
          >
            {{ cell.value }}
          </span>
        </div>
      </dx-data-grid>

      <dx-load-panel
        [position]="{ of: '.progress-grid' }"
        container=".progress-grid"
        [visible]="isMultiProcessing"
        [showIndicator]="true"
        [showPane]="true"
        [shading]="true"
        [message]="'Uploading...'"
        [wrapperAttr]="{ style: 'z-index: 9999;' }"
      ></dx-load-panel>
    </div>
  </dx-popup>
</div>
