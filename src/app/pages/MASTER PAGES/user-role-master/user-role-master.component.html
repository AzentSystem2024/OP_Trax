<div class="view-wrapper list-page">
  <dx-data-grid
    (onOptionChanged)="onGridOptionChanged($event)"
    class="grid theme-dependent"
    noDataText="no data"
    height="600"
    [dataSource]="dataSource"
    [showBorders]="true"
    [allowColumnResizing]="true"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    (onExporting)="onExporting($event)"
    (onRowRemoving)="onRowRemoving($event)"
    (onEditingStart)="onEditingStart($event)"
    (onCellPrepared)="onCellPrepared($event)"
    height="82vh"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-editing
      mode="popup"
      [allowUpdating]="menuPrevilage.CanEdit"
      [allowDeleting]="menuPrevilage.CanDelete"
      [allowAdding]="menuPrevilage.CanAdd"
    >
    </dxo-editing>

    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"
    >
    </dxo-pager>
    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>
    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-column-chooser [enabled]="true" [height]="400"></dxo-column-chooser>
    <dxo-search-panel [visible]="true" placeholder=" Search"></dxo-search-panel>
    <dxo-export
      [enabled]="menuPrevilage?.CanExport"
      [allowExportSelectedData]="false"
      [formats]="['xlsx']"
    >
    </dxo-export>
    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header">User Role</div>
      </dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' }
        }"
      ></dxi-item>
      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          onClick: refresh,
          stylingMode: 'text',
          hint: 'refresh'
        }"
      ></dxi-item>

      <dxi-item
        name="exportButton"
        location="after"
        cssClass="custom-export-button"
      ></dxi-item>
      <dxi-item
        location="after"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxi-column dataField="UserRoles" caption="User Role"></dxi-column>
    <dxi-column
      dataField="LastModifiedTime"
      Caption="Last Modified Time"
      [calculateCellValue]="formatLastModifiedTime"
    ></dxi-column>

    <dxo-filter-panel [visible]="isFilterRowVisible || isFilterApplied"></dxo-filter-panel>
  </dx-data-grid>

  <!-- =========== add new user level ============ -->
  <dx-popup
    class="role-management-popup"
    [(visible)]="isAddFormVisible"
    [width]="'960px'"
    [maxWidth]="'95vw'"
    [height]="'auto'"
    [maxHeight]="'95vh'"
    [showTitle]="false"
    [shading]="true"
    [dragEnabled]="false"
    (onHiding)="onPopupClose()"
  >
    <div *dxTemplate="let data of 'content'" class="role-modal-container">
      <div class="role-modal-header">
        <div class="role-modal-title-wrap">
          <h3 class="role-modal-title">New User Role</h3>
          <p class="role-modal-subtitle">Configure custom access levels and permissions matrix</p>
        </div>
        <button type="button" class="role-modal-close-btn" (click)="onPopupClose()" title="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="role-modal-divider"></div>
      <div class="role-modal-body">
        <app-user-level-new-form
          *ngIf="isAddFormVisible"
          (save)="onClickSaveNewData()"
          (cancel)="onPopupClose()"
        ></app-user-level-new-form>
      </div>
    </div>
  </dx-popup>

  <!-- =========== edit user level ============ -->
  <dx-popup
    class="role-management-popup"
    [(visible)]="iseditFormVisible"
    [width]="'960px'"
    [maxWidth]="'95vw'"
    [height]="'auto'"
    [maxHeight]="'95vh'"
    [showTitle]="false"
    [shading]="true"
    [dragEnabled]="false"
    (onHiding)="onEditPopupClose()"
  >
    <div *dxTemplate="let data of 'content'" class="role-modal-container">
      <div class="role-modal-header">
        <div class="role-modal-title-wrap">
          <h3 class="role-modal-title">Edit User Role</h3>
          <p class="role-modal-subtitle">Configure custom access levels and permissions matrix</p>
        </div>
        <button type="button" class="role-modal-close-btn" (click)="onEditPopupClose()" title="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="role-modal-divider"></div>
      <div class="role-modal-body">
        <app-user-level-new-form
          *ngIf="iseditFormVisible"
          [editValue]="clickedRowData"
          (save)="onRowUpdating()"
          (cancel)="onEditPopupClose()"
        ></app-user-level-new-form>
      </div>
    </div>
  </dx-popup>
</div>
