<div class="view-wrapper list-page">
  <dx-data-grid
    #cptPriceGrid
    class="grid theme-dependent"
    [class.is-editing]="isEditingEnabled"
    [dataSource]="cptPriceData"
    [showBorders]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [allowColumnResizing]="true"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    [hoverStateEnabled]="isEditingEnabled"
    [editing]="{
      mode: 'cell',
      allowUpdating: isEditingEnabled,
      allowAdding: isEditingEnabled,
      allowDeleting: isEditingEnabled,
      startEditAction: isEditingEnabled ? 'click' : 'dblClick',
      newRowPosition: 'last',
    }"
    height="82vh"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onCellClick)="onCellClick($event)"
    (onRowUpdated)="onRowUpdated($event)"
    (onRowPrepared)="onRowPrepared($event)"
    (onOptionChanged)="onGridOptionChanged($event)"
    (onInitNewRow)="onInitNewRow($event)"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"
    >
    </dxo-pager>

    <dxo-load-panel [enabled]="true"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>

    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>

    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-column-chooser [enabled]="true" [height]="400"></dxo-column-chooser>
    <dxo-search-panel [visible]="true" placeholder="Search"></dxo-search-panel>

    <!-- Toolbar -->
    <dxo-toolbar>
      <!-- Header -->
      <dxi-item location="before">
        <div class="grid-header">Facility Multiplier</div>
      </dxi-item>

      <!-- Facility Dropdown -->
      <dxi-item
        location="after"
        locateInMenu="never"
        template="facilitySelectTemplate"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' },
        }"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          hint: 'refresh',
          onClick: refresh,
          stylingMode: 'text',
        }"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="importButtonOptions"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="editButtonOptions"
      ></dxi-item>

      <dxi-item
        [visible]="isEditingEnabled"
        location="after"
        widget="dxButton"
        [options]="addRowButtonOptions"
      ></dxi-item>

      <dxi-item
        [visible]="isEditingEnabled"
        location="after"
        widget="dxButton"
        [options]="saveButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <div *dxTemplate="let data of 'facilitySelectTemplate'">
      <dx-select-box
        label="Facility"
        labelMode="floating"
        [dataSource]="facilityList"
        displayExpr="FacilityName"
        valueExpr="FacilityLicense"
        [(value)]="selectedFacilityID"
        [showClearButton]="true"
        [searchEnabled]="true"
        width="250"
        (onValueChanged)="onFacilityChanged($event)"
      ></dx-select-box>
    </div>

    <!-- Grid Columns Here -->
    <dxi-column
      dataField="SerialNumber"
      caption="SL"
      [allowEditing]="false"
      alignment="center"
      [width]="60"
    >
    </dxi-column>

    <dxi-column
      dataField="ReceiverID"
      caption="Receiver"
      [allowEditing]="isEditingEnabled"
      alignment="center"
      [width]="200"
      [calculateDisplayValue]="calculateReceiverDisplay"
      [lookup]="{
        dataSource: receiverDataSource,
        valueExpr: 'ID',
        displayExpr: 'DESCRIPTION',
      }"
    >
    </dxi-column>

    <dxi-column
      dataField="ServiceCategoryID"
      caption="Service Category"
      [allowEditing]="isEditingEnabled"
      alignment="center"
      [width]="250"
      [calculateDisplayValue]="calculateServiceCategoryDisplay"
      [lookup]="{
        dataSource: serviceCategoryDataSource,
        valueExpr: 'ID',
        displayExpr: 'DESCRIPTION',
      }"
    >
      <dxi-validation-rule
        type="custom"
        [validationCallback]="validateServiceCategoryOrCpt"
        message="Either Service Category or CPT is required when Multiplier is greater than 0"
        [reevaluate]="true"
      ></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="CPT"
      caption="CPT"
      [allowEditing]="isEditingEnabled"
      alignment="center"
    >
      <dxi-validation-rule
        type="stringLength"
        [max]="50"
        message="CPT must not exceed 50 characters"
      ></dxi-validation-rule>
      <dxi-validation-rule
        type="custom"
        [validationCallback]="validateServiceCategoryOrCpt"
        message="Either Service Category or CPT is required when Multiplier is greater than 0"
        [reevaluate]="true"
      ></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      dataField="Multiplier"
      caption="Multiplier"
      dataType="number"
      format="#,##0.00"
      [allowEditing]="isEditingEnabled"
      alignment="center"
    >
      <dxi-validation-rule
        type="required"
        message="Multiplier is required"
      ></dxi-validation-rule>
      <dxi-validation-rule
        type="numeric"
        message="Multiplier must be a number"
      ></dxi-validation-rule>
      <dxi-validation-rule
        type="custom"
        [validationCallback]="validateMultiplierPositive"
        message="Multiplier must be greater than 0"
      ></dxi-validation-rule>
    </dxi-column>

    <dxi-column
      type="buttons"
      [visible]="isEditingEnabled"
      [width]="60"
      alignment="center"
    >
      <dxi-button name="delete"></dxi-button>
    </dxi-column>

    <dxo-filter-panel
      [visible]="isFilterRowVisible || isFilterApplied"
    ></dxo-filter-panel>
  </dx-data-grid>

  <!-- =========== Import Multipliers Popup =========== -->
  <dx-popup
    [(visible)]="importPopupVisible"
    [width]="'88%'"
    [height]="'85vh'"
    title="Import Facility Multipliers"
    [showCloseButton]="true"
    (onHiding)="onImportPopupHiding()"
  >
    <div class="import-popup-container">
      <div class="import-actions-bar">
        <div class="left-actions">
          <dx-button
            text="Download Template"
            icon="download"
            stylingMode="contained"
            type="default"
            hint="Download Excel template with required columns"
            (onClick)="downloadImportTemplate()"
          ></dx-button>
          <dx-button
            text="Import Excel File"
            icon="import"
            stylingMode="contained"
            type="default"
            hint="Select Excel file (.xlsx, .xls, .csv) to import"
            (onClick)="triggerFileInput()"
          ></dx-button>
          <input
            #importFileInput
            type="file"
            accept=".xlsx, .xls, .csv"
            style="display: none"
            (change)="onImportFileSelected($event)"
          />
          <span *ngIf="importedFileName" class="file-name-label">
            <strong>File:</strong> {{ importedFileName }}
          </span>
        </div>

        <div class="right-actions">
          <!-- <span *ngIf="hasImportErrors" class="error-badge">
            <i class="dx-icon-warning"></i> Some cells contain invalid data.
            Hover over red cells to view details.
          </span> -->
          <dx-button
            text="Save"
            icon="save"
            stylingMode="contained"
            type="success"
            [disabled]="hasImportErrors || importedGridData.length === 0"
            hint="Save valid imported multiplier data"
            (onClick)="saveImportedData()"
          ></dx-button>
          <dx-button
            text="Close"
            icon="close"
            stylingMode="outlined"
            type="normal"
            (onClick)="closeImportPopup()"
          ></dx-button>
        </div>
      </div>

      <dx-data-grid
        #importDataGrid
        [dataSource]="displayedImportGridData"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        height="calc(85vh - 215px)"
        (onCellPrepared)="onImportCellPrepared($event)"
        (onCellClick)="onImportCellClick($event)"
        
      >
        <dxo-paging [pageSize]="15"></dxo-paging>
        <dxo-pager
          [visible]="true"
          [allowedPageSizes]="[10, 15, 25,]"
          [showPageSizeSelector]="true"
          [showInfo]="true"
        ></dxo-pager>
        

        <dxi-column
          dataField="Facility"
          caption="Facility"
          alignment="center"
        ></dxi-column>

        <dxi-column
          dataField="Receiver"
          caption="Receiver"
          alignment="center"
        ></dxi-column>

        <dxi-column
          dataField="ServiceCategory"
          caption="Service Category"
          alignment="center"
        ></dxi-column>

        <dxi-column
          dataField="CPT"
          caption="CPT"
          alignment="center"
        ></dxi-column>

        <dxi-column
          dataField="Multiplier"
          caption="Multiplier"
          dataType="number"
          format="#,##0.00"
          alignment="center"
        ></dxi-column>

        <dxi-column type="buttons" [width]="70" alignment="center">
          <dxi-button name="delete"></dxi-button>
        </dxi-column>
      </dx-data-grid>

      <!-- Bottom Footer Bar: Show invalid rows only checkbox & summary stats -->
      <div class="import-footer-bar">
        <div class="footer-left">
          <dx-check-box
            [(value)]="showOnlyInvalidRows"
            text="Show invalid rows only"
            (onValueChanged)="onShowOnlyInvalidRowsChanged($event)"
          ></dx-check-box>
          <span class="filter-count-badge" *ngIf="showOnlyInvalidRows">
            Showing {{ displayedImportGridData.length }} of {{ importedGridData.length }} rows
          </span>
        </div>
        <div class="footer-right">
          <span class="total-count-label">
            Total Rows: <strong>{{ importedGridData.length }}</strong> &nbsp;|&nbsp;
            Invalid Rows:
            <strong [style.color]="totalInvalidRowsCount > 0 ? '#dc3545' : '#28a745'">
              {{ totalInvalidRowsCount }}
            </strong>
          </span>
        </div>
      </div>

      <!-- Tooltip styled like DevExtreme required validator message -->
      <dx-tooltip
        [target]="clickedCellElement"
        [(visible)]="cellTooltipVisible"
        position="top"
        [closeOnOutsideClick]="true"
        wrapperAttr="{ class: 'import-error-tooltip' }"
      >
        <div
          *dxTemplate="let data of 'content'"
          class="dx-invalid-message-content"
        >
          <i class="dx-icon-warning error-icon"></i>
          <span>{{ clickedCellErrorMessage }}</span>
        </div>
      </dx-tooltip>
    </div>
  </dx-popup>
</div>
