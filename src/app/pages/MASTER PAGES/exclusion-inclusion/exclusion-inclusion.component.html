<div class="view-wrapper list-page">
  <dx-data-grid
    class="grid theme-dependent"
    noDataText="No Exclusion/Inclusion Rules found"
    height="82vh"
    [dataSource]="dataSource"
    [showBorders]="true"
    [allowColumnResizing]="true"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onRowUpdating)="onRowUpdating($event)"
    (onRowRemoving)="onRowRemoving($event)"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>

    <dxo-editing
      mode="popup"
      [allowUpdating]="menuPrevilage?.CanEdit ?? true"
      [allowDeleting]="menuPrevilage?.CanDelete ?? true"
      [popup]="{
        title: 'Exclusion/Inclusion Rule',
        showTitle: true,
        width: 700,
        height: 'auto',
      }"
    >
      <dxo-form labelMode="floating">
        <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
          <dxi-item
            dataField="CPTCode"
            editorType="dxTextBox"
            [colSpan]="2"
            [editorOptions]="{ placeholder: 'Enter CPT (comma separated)' }"
          >
            <dxo-label text="CPT"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="CPT is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ClinicianID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: clinicianDataSource,
              valueExpr: 'ID',
              displayExpr: 'ClinicianLicense',
              searchEnabled: true,
              acceptCustomValue: true,
            }"
          >
            <dxo-label text="Clinician"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Clinician is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="SpecialtyID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: specialityList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
              acceptCustomValue: true,
              readOnly: isSpecialtyReadOnly,
            }"
          >
            <dxo-label text="Specialty"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Specialty is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ICDCode"
            editorType="dxTextBox"
            [colSpan]="2"
            [editorOptions]="{ placeholder: 'Enter ICD Code' }"
          >
            <dxo-label text="ICD Code"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="ICD Code is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ADOCStatusID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: adocRuleList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
            }"
          >
            <dxo-label text="ADOC Rule"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="ADOC Rule is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ADOCClassID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: adocClassList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
              readOnly: isAdocClassReadOnly,
            }"
          >
            <dxo-label text="ADOC Class"></dxo-label>
          </dxi-item>
          <dxi-item
            dataField="EffectFrom"
            editorType="dxDateBox"
            [editorOptions]="{
              displayFormat: 'dd-MMM-yyyy',
              useMaskBehavior: true,
            }"
          >
            <dxo-label text="Effect From"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Effect From is required"
            ></dxi-validation-rule>
          </dxi-item>
        </dxi-item>
      </dxo-form>
    </dxo-editing>

    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      displayMode="full"
      [showPageSizeSelector]="true"
      [showInfo]="true"
      [showNavigationButtons]="true"
    >
    </dxo-pager>

    <dxo-load-panel [showPane]="false"></dxo-load-panel>
    <dxo-sorting mode="multiple"></dxo-sorting>
    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>
    <dxo-scrolling mode="virtual"></dxo-scrolling>

    <dxo-export
      [enabled]="true"
      [allowExportSelectedData]="false"
      [formats]="['xlsx']"
    >
    </dxo-export>

    <dxo-toolbar>
      <dxi-item location="before">
        <div class="grid-header">Exclusion/Inclusion Rules</div>
      </dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' },
        }"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          hint: 'Refresh',
          onClick: refresh,
          stylingMode: 'text',
        }"
      ></dxi-item>

      <dxi-item
        name="exportButton"
        location="after"
        cssClass="custom-export-button"
        [disabled]="!isDataAvailable"
      ></dxi-item>

      <dxi-item
        location="after"
        widget="dxButton"
        [options]="addButtonOptions"
      ></dxi-item>
    </dxo-toolbar>

    <dxi-column
      dataField="SlNo"
      caption="Sl No."
      [width]="70"
      [allowEditing]="false"
      alignment="center"
    ></dxi-column>
    <dxi-column dataField="CPTCode" caption="CPT"></dxi-column>
    <dxi-column dataField="ClinicianID" caption="Clinician">
      <dxo-lookup
        [dataSource]="clinicianList"
        valueExpr="ID"
        displayExpr="ClinicianLicense"
      ></dxo-lookup>
    </dxi-column>
    <dxi-column dataField="SpecialtyID" caption="Specialty">
      <dxo-lookup
        [dataSource]="specialityList"
        valueExpr="ID"
        displayExpr="DESCRIPTION"
      ></dxo-lookup>
    </dxi-column>
    <dxi-column dataField="ICDCode" caption="ICD Code"></dxi-column>
    <dxi-column dataField="ADOCStatusID" caption="ADOC Rule">
      <dxo-lookup
        [dataSource]="adocRuleList"
        valueExpr="ID"
        displayExpr="DESCRIPTION"
      ></dxo-lookup>
    </dxi-column>
    <dxi-column dataField="ADOCClassID" caption="ADOC Class">
      <dxo-lookup
        [dataSource]="adocClassList"
        valueExpr="ID"
        displayExpr="DESCRIPTION"
      >
      </dxo-lookup>
    </dxi-column>
    <dxi-column
      dataField="EffectFrom"
      caption="Effect From"
      dataType="date"
      format="dd-MMM-yyyy"
    ></dxi-column>
  </dx-data-grid>

  <!-- ========= new form popup ========= -->
  <dx-popup
    [(visible)]="isAddPopupVisible"
    title="New Exclusion/Inclusion Rule"
    [width]="700"
    [height]="'auto'"
    [showCloseButton]="true"
    [hideOnOutsideClick]="false"
  >
    <div *dxTemplate="let data of 'content'">
      <dx-form #addForm [formData]="newRule" labelMode="floating">
        <dxi-item itemType="group" [colCount]="2" [colSpan]="2">
          <dxi-item
            dataField="CPTCode"
            editorType="dxTextBox"
            [colSpan]="2"
            [editorOptions]="{ placeholder: 'Enter CPT (comma separated)' }"
          >
            <dxo-label text="CPT"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="CPT is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ClinicianID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: clinicianDataSource,
              valueExpr: 'ID',
              displayExpr: 'ClinicianLicense',
              searchEnabled: true,
              acceptCustomValue: true,
              onValueChanged: onClinicianChangedInPopup,
            }"
          >
            <dxo-label text="Clinician"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Clinician is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="SpecialtyID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: specialityList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
              acceptCustomValue: true,
              readOnly: isSpecialtyReadOnly,
            }"
          >
            <dxo-label text="Specialty"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Specialty is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ICDCode"
            editorType="dxTextBox"
            [colSpan]="2"
            [editorOptions]="{ placeholder: 'Enter ICD Code' }"
          >
            <dxo-label text="ICD Code"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="ICD Code is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ADOCStatusID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: adocRuleList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
              onValueChanged: onAdocRuleChangedInPopup,
            }"
          >
            <dxo-label text="ADOC Rule"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="ADOC Rule is required"
            ></dxi-validation-rule>
          </dxi-item>
          <dxi-item
            dataField="ADOCClassID"
            editorType="dxSelectBox"
            [editorOptions]="{
              dataSource: adocClassList,
              valueExpr: 'ID',
              displayExpr: 'DESCRIPTION',
              searchEnabled: true,
              readOnly: isAdocClassReadOnly,
            }"
          >
            <dxo-label text="ADOC Class"></dxo-label>
          </dxi-item>
          <dxi-item
            dataField="EffectFrom"
            editorType="dxDateBox"
            [editorOptions]="{
              displayFormat: 'dd-MMM-yyyy',
              useMaskBehavior: true,
            }"
          >
            <dxo-label text="Effect From"></dxo-label>
            <dxi-validation-rule
              type="required"
              message="Effect From is required"
            ></dxi-validation-rule>
          </dxi-item>
        </dxi-item>
      </dx-form>

      <div class="mt-5 text-end">
        <dx-button
          text="Cancel"
          stylingMode="outlined"
          type="normal"
          (onClick)="isAddPopupVisible = false"
        ></dx-button>

        <dx-button
          class="ms-2"
          text="Save"
          stylingMode="contained"
          type="default"
          (onClick)="saveNewRule()"
        ></dx-button>
      </div>
    </div>
  </dx-popup>
</div>
