<div class="view-wrapper list-page">
  <dx-data-grid
    #cptPriceGrid
    class="grid theme-dependent"
    [dataSource]="cptPriceData"
    [showBorders]="true"
    [showColumnLines]="true"
    [showRowLines]="true"
    [allowColumnResizing]="true"
    [columnResizingMode]="'widget'"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    rowAlternationInterval="2"
    [editing]="{
      mode: 'cell',
      allowUpdating: true,
      startEditAction: 'dblClick',
    }"
    height="82vh"
    [allowColumnResizing]="true"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onRowUpdated)="onRowUpdated($event)"
    (onRowPrepared)="onRowPrepared($event)"
    (onOptionChanged)="onGridOptionChanged($event)"
  >
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [visible]="true"
      [allowedPageSizes]="allowedPageSizes"
      [displayMode]="displayMode"
      [showPageSizeSelector]="showPageSizeSelector"
      [showInfo]="showInfo"
      [showNavigationButtons]="showNavButtons"
    >
    </dxo-pager>

    <dxo-load-panel [enabled]="true"></dxo-load-panel>
    <dxo-scrolling mode="virtual"></dxo-scrolling>
    <dxo-sorting mode="multiple"></dxo-sorting>

    <dxo-header-filter [visible]="isFilterRowVisible">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>

    <dxo-filter-row [visible]="isFilterRowVisible"></dxo-filter-row>

    <!-- Toolbar -->
    <dxo-toolbar>
      <!-- Header -->
      <dxi-item location="before">
        <div class="grid-header">ADOC Price Master</div>
      </dxi-item>

      <!-- ADOC Version Dropdown -->
      <dxi-item
        location="after"
        locateInMenu="never"
        template="versionSelectTemplate"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          icon: isFilterRowVisible ? 'filter' : 'filter',
          hint: isFilterRowVisible ? 'Hide Filter Row' : 'Show Filter Row',
          onClick: toggleFilterRow,
          stylingMode: 'text',
          elementAttr: { class: 'commonButtons' },
        }"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Refresh',
          icon: 'refresh',
          hint: 'refresh',
          onClick: refresh,
          stylingMode: 'text',
        }"
      ></dxi-item>

      <dxi-item
        location="after"
        locateInMenu="auto"
        showText="inMenu"
        widget="dxButton"
        [options]="{
          text: 'Edit',
          icon: 'edit',
          hint: 'Modify values',
          onClick: onAddClick,
          stylingMode: 'text',
        }"
      ></dxi-item>

      <!-- <dxi-item *ngIf="menuPrevilage?.CanExport" name="exportButton" location="after"></dxi-item> -->
    </dxo-toolbar>

    <!-- Grid Columns Here -->
    <dxi-column
      dataField="SerialNumber"
      caption="SL"
      [allowEditing]="false"
      alignment="center"
      [width]="60"
    >
    </dxi-column>

    <dxi-column
      dataField="ADOCClassName"
      caption="ADOC Class"
      [allowEditing]="false"
    >
    </dxi-column>

    <dxi-column
      dataField="ADOCVersion"
      caption="ADOC Version"
      [visible]="false"
    >
    </dxi-column>

    <dxi-column caption="Active Values" alignment="center">
      <dxi-column
        dataField="Price"
        caption="Base Price (AED)"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="PaedAdjuster"
        caption="Pediatric Adjuster"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="SeniorAdjuster"
        caption="Senior Adjuster"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="FollowUpAdjuster"
        caption="8-14 follow-up adjuster"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="NewPatientAdjuster"
        caption="New Patient Adjuster"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="TeleMedicineAdjuster"
        caption="TeleMedicine Adjuster"
        dataType="number"
        format="#,##0.00"
        [allowEditing]="false"
        alignment="right"
      >
      </dxi-column>

      <dxi-column
        dataField="EffectFrom"
        caption="Effect From"
        dataType="date"
        format="dd-MM-yyyy"
        [allowEditing]="false"
        alignment="center"
      >
      </dxi-column>
    </dxi-column>

    <dxi-column type="buttons" [width]="60" *ngIf="cptPriceData.length > 0">
      <dxi-button
        hint="View History Data"
        icon="errorcircle"
        [onClick]="onHistoryClick.bind(this)"
      >
      </dxi-button>
    </dxi-column>

    <div *dxTemplate="let data of 'versionSelectTemplate'">
      <dx-select-box
        [dataSource]="versionList"
        [displayExpr]="displayVersionExpr"
        [valueExpr]="versionValueExpr"
        [(value)]="selectedVersion"
        label="Select Version"
        [labelMode]="'floating'"
        [searchEnabled]="true"
        width="200"
        (onValueChanged)="onVersionChanged($event)"
      ></dx-select-box>
    </div>

    <dxo-filter-panel
      [visible]="isFilterRowVisible || isFilterApplied"
    ></dxo-filter-panel>
  </dx-data-grid>

  <!-- =========== History Popup =========== -->
  <dx-popup
    [(visible)]="historyPopupVisible"
    [width]="'80%'"
    [height]="'auto'"
    title="ADOC Class Price History"
    [showCloseButton]="true"
    (onShown)="onHistoryPopupShown()"
  >
    <dx-data-grid
      #historyGrid
      [dataSource]="PriceHistoryData"
      [showBorders]="true"
      height="60vh"
      (onOptionChanged)="onGridOptionChanged($event)"
    >
      <dxi-column
        dataField="Price"
        caption="Base Price"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>
      <dxi-column
        dataField="PaedAdjuster"
        caption="Pediatric Adjuster"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>
      <dxi-column
        dataField="SeniorAdjuster"
        caption="Senior Adjuster"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>

      <dxi-column
        dataField="FollowUpAdjuster"
        caption="8-14 follow-up adjuster"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>

      <dxi-column
        dataField="NewPatientAdjuster"
        caption="New Patient Adjuster"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>

      <dxi-column
        dataField="TeleMedicineAdjuster"
        caption="TeleMedicine Adjuster"
        dataType="number"
        format="#,##0.00"
      ></dxi-column>

      <dxi-column
        dataField="EffectFrom"
        caption="Effective From"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>

      <dxi-column
        dataField="EffectTo"
        caption="Effective To"
        dataType="date"
        format="dd-MM-yyyy"
      ></dxi-column>
    </dx-data-grid>
  </dx-popup>

  <dx-popup
    [width]="'80%'"
    [height]="'80%'"
    [showTitle]="true"
    title="Update ADOC Price"
    [dragEnabled]="false"
    [hideOnOutsideClick]="false"
    [showCloseButton]="true"
    [(visible)]="isAddPopupVisible"
  >
    <div *dxTemplate="let data of 'content'">
      <div style="display: flex; flex-direction: column; height: 100%">
        <div
          style="
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <label style="font-weight: 500; margin: 0">Effect From:</label>
            <dx-date-box
              [(value)]="globalEffectFromDate"
              type="date"
              displayFormat="dd-MM-yyyy"
              [width]="160"
              placeholder="Select Date..."
            ></dx-date-box>
          </div>
        </div>

        <dx-data-grid
          #popupGrid
          [dataSource]="cptPriceData"
          [showBorders]="true"
          [showColumnLines]="true"
          [showRowLines]="true"
          [rowAlternationEnabled]="true"
          height="55vh"
          [editing]="{ mode: 'cell', allowUpdating: true }"
          [allowColumnResizing]="true"
          [columnResizingMode]="'widget'"
        >
          <dxo-load-panel [enabled]="true"></dxo-load-panel>
          <dxo-scrolling mode="virtual" rowRenderingMode="virtual"></dxo-scrolling>
          <dxo-paging [pageSize]="50"></dxo-paging>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
          <dxo-keyboard-navigation
            enterKeyAction="moveFocus"
            enterKeyDirection="column"
          ></dxo-keyboard-navigation>

          <dxi-column
            dataField="IsSelected"
            caption=""
            dataType="boolean"
            [width]="50"
            [allowEditing]="false"
            headerCellTemplate="headerChkTemplate"
            cellTemplate="chkTemplate"
            alignment="center"
            [allowSorting]="false"
            [allowFiltering]="false"
            [allowHeaderFiltering]="false"
          >
          </dxi-column>

          <dxi-column
            dataField="ADOCClassName"
            caption="ADOC Class"
            [allowEditing]="false"
          ></dxi-column>

          <dxi-column
            dataField="NewPrice"
            caption="Base Price"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>
          <dxi-column
            dataField="NewPaedAdjuster"
            caption="Pediatric Adjuster"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>
          <dxi-column
            dataField="NewSeniorAdjuster"
            caption="Senior Adjuster"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>
          <dxi-column
            dataField="NewFollowUpAdjuster"
            caption="8-14 follow-up adjuster"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>
          <dxi-column
            dataField="NewNewPatientAdjuster"
            caption="New Patient Adjuster"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>
          <dxi-column
            dataField="NewTeleMedicineAdjuster"
            caption="TeleMedicine Adjuster"
            dataType="number"
            format="#,##0.00"
            alignment="left"
          >
          </dxi-column>

          <div
            *dxTemplate="let info of 'headerChkTemplate'"
            style="
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100%;
              width: 100%;
            "
            (click)="$event.stopPropagation()"
          >
            <dx-check-box
              [value]="isSelectAll"
              (onValueChanged)="onSelectAllChanged($event)"
            ></dx-check-box>
          </div>

          <div
            *dxTemplate="let cell of 'chkTemplate'"
            style="
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100%;
              width: 100%;
            "
            (click)="$event.stopPropagation()"
          >
            <dx-check-box
              [value]="cell.data.IsSelected === true"
              (onValueChanged)="onCheckboxChanged($event, cell)"
            ></dx-check-box>
          </div>
        </dx-data-grid>

        <div style="display: flex; justify-content: flex-end; margin-top: 15px">
          <dx-button
            text="Save"
            type="default"
            stylingMode="contained"
            (onClick)="savePriceMaster()"
          ></dx-button>
        </div>
      </div>
    </div>
  </dx-popup>
</div>
