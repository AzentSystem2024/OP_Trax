<!-- <h6>Login To Your Account</h6> -->
<form class="login-form" (submit)="onSubmit($event)">
  <dx-form
    [formData]="formData"
    [disabled]="loading"
    title="Login To Your Account"
    [showColonAfterLabel]="true"
    [showRequiredMark]="false"
  >
    <dxi-item
      dataField="username"
      editorType="dxTextBox"
      [editorOptions]="{
        placeholder: 'User Name',
        stylingMode: 'filled',
        buttons:[ {
        name: 'search',
        location: 'before',
        options: {
          icon: 'fas fa-user',
          stylingMode: 'text',
          disabled: true
        }
      }],
      }"
    >
      <dxi-validation-rule
        type="required"
        message="Username is required"
      ></dxi-validation-rule>
      <dxo-label [visible]="false"></dxo-label>
    </dxi-item>

    <dxi-item
      dataField="password"
      editorType="dxTextBox"
      [editorOptions]="{
        placeholder: 'Password',
        stylingMode: 'filled',
        mode: isPasswordVisible ? 'text' : 'password',
        buttons: [
          {
            name: 'search',
            location: 'before',
            options: {
              icon: 'fas fa-lock',
              stylingMode: 'text',
              disabled: true
            }
          },
          {
            name: 'passwordToggle',
            location: 'after',
            options: {
              icon: isPasswordVisible ? 'fas fa-eye' : 'fas fa-eye-slash',
              onClick: togglePasswordVisibility,
              stylingMode: 'text',
              hoverable: 'false'
            }
          }
        ]
      }"
    >
      <dxi-validation-rule
        type="required"
        message="Password is required"
      ></dxi-validation-rule>
      <dxo-label [visible]="false"></dxo-label>
    </dxi-item>
      <dxi-item>
      <div class="reset-link">
  <a href="" (click)="onForgotPasswordClick($event)" style="text-decoration: none; font-size: 18px;">
    Forgot password?
  </a>
</div>
  </dxi-item>

    <dxi-item itemType="button" class="mt-3">
      <dxo-button-options
        width="100%"
        [height]="'44px'"
        type="default"
        cssClass="btn-sign-in"
        [useSubmitBehavior]="true"
        [template]="'signInTemplate'"
      >
      </dxo-button-options>
    </dxi-item>


    <ng-container *dxTemplate="let item of 'signInTemplate'">
      <span class="dx-button-text">
        <ng-container *ngIf="loading; else notLoading">
          <dx-load-indicator
            width="24px"
            height="24px"
            [visible]="true"
          ></dx-load-indicator>
        </ng-container>
        <ng-template #notLoading>Sign In</ng-template>
      </span>
    </ng-container>
  </dx-form>
</form>

<dx-popup
  [width]="440"
  [height]="'auto'"
  [showTitle]="true"
  title="Verify OTP"
  [dragEnabled]="false"
  [hideOnOutsideClick]="false"
  [showCloseButton]="true"
  [(visible)]="isOtpPopupVisible"
  (onShown)="onPopupShown()"
  (onHiding)="onPopupHiding()"
>
  <div *dxTemplate="let data of 'content'" class="p-3 text-center">
    <p style="font-size: 15px; margin-bottom: 20px;">
      Verify your OTP sending to the email - <strong>{{ otpEmail }}</strong>
    </p>

    <div class="otp-inputs d-flex justify-content-center gap-2 mb-4">
      <dx-text-box
        #otp1
        [(value)]="otpDigits[0]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 0)"
      ></dx-text-box>
      <dx-text-box
        #otp2
        [(value)]="otpDigits[1]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 1)"
      ></dx-text-box>
      <dx-text-box
        #otp3
        [(value)]="otpDigits[2]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 2)"
      ></dx-text-box>
      <dx-text-box
        #otp4
        [(value)]="otpDigits[3]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 3)"
      ></dx-text-box>
      <dx-text-box
        #otp5
        [(value)]="otpDigits[4]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 4)"
      ></dx-text-box>
      <dx-text-box
        #otp6
        [(value)]="otpDigits[5]"
        maxLength="1"
        valueChangeEvent="keyup"
        stylingMode="outlined"
        placeholder="-"
        class="otp-input"
        [disabled]="isVerifyingOtp"
        (keyup)="onOtpKeyUp($event, 5)"
      ></dx-text-box>
    </div>

    <!-- OTP Countdown Timer & Resend Button -->
    <div class="otp-timer-container">
      <span *ngIf="!canResendOtp" class="timer-text">
        Resend OTP in <strong>{{ otpCountdown }}s</strong>
      </span>
      <div *ngIf="canResendOtp" class="resend-container">
        <span class="text-muted">Didn't receive the OTP?</span>
        <a
          href="javascript:void(0)"
          (click)="onResendOtpClick()"
          class="resend-link"
          [class.disabled]="isResendingOtp"
        >
          {{ isResendingOtp ? 'Resending...' : 'Resend OTP' }}
        </a>
      </div>
    </div>

    <div class="mt-3">
      <dx-button
        [text]="isVerifyingOtp ? 'Verifying...' : 'Verify'"
        type="default"
        stylingMode="contained"
        [width]="'100%'"
        [height]="'40px'"
        [disabled]="isVerifyingOtp || !isOtpComplete"
        (onClick)="onVerifyOtpClick()"
      ></dx-button>
    </div>
  </div>
</dx-popup>
